<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Basic P2P Chat Client</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #log { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 5px; }
  #input { width: 80%; }
  #send { width: 18%; }
</style>
</head>
<body>

<h2>P2P Chat Client</h2>

<div id="log"></div>
<input type="text" id="input" placeholder="Type a message..." autocomplete="off" />
<button id="send">Send</button>

<script>
(() => {
  const signalingServerIp = "192.168.1.211"; // Change to your signaling server IP!
  const signalingServerPort = 8001;
  const clientId = "client-" + Math.floor(Math.random() * 10000);

  const logDiv = document.getElementById("log");
  const inputBox = document.getElementById("input");
  const sendButton = document.getElementById("send");

  // Utility: log messages
  function log(msg) {
    const p = document.createElement("p");
    p.textContent = msg;
    logDiv.appendChild(p);
    logDiv.scrollTop = logDiv.scrollHeight;
    console.log(msg);
  }

  // WebSocket connection
  const ws = new WebSocket(`ws://${signalingServerIp}:${signalingServerPort}`);

  // Store peers: {peerId: true}
  const peers = {};

  ws.onopen = () => {
    log(`WebSocket connected to ws://${signalingServerIp}:${signalingServerPort}`);
    // Register self
    const registerMsg = JSON.stringify({type: "register", clientId});
    ws.send(registerMsg);
    log(`Sent register message: ${registerMsg}`);
  };

  ws.onmessage = (event) => {
    log(`Received: ${event.data}`);
    const data = JSON.parse(event.data);

    switch(data.type) {
      case "peer_list":
        data.peers.forEach(pid => {
          peers[pid] = true;
          log(`Peer online: ${pid}`);
        });
        break;

      case "peer_joined":
        peers[data.peerId] = true;
        log(`Peer joined: ${data.peerId}`);
        break;

      case "peer_left":
        delete peers[data.peerId];
        log(`Peer left: ${data.peerId}`);
        break;

      case "offer":
      case "answer":
      case "ice_candidate":
        // For now just log signaling messages
        log(`Signaling message (${data.type}) from ${data.senderId}`);
        break;

      default:
        log(`Unknown message type: ${data.type}`);
    }
  };

  ws.onclose = () => {
    log("WebSocket connection closed");
  };

  ws.onerror = (err) => {
    log("WebSocket error: " + err.message);
  };

  // Send chat message to all peers (broadcast via signaling server)
  function sendMessage() {
    const msg = inputBox.value.trim();
    if (!msg) return;

    inputBox.value = "";
    log(`Me: ${msg}`);

    // We'll send a custom 'chat' message to all peers
    Object.keys(peers).forEach(peerId => {
      const chatMsg = {
        type: "chat",
        senderId: clientId,
        targetId: peerId,
        data: msg
      };
      ws.send(JSON.stringify(chatMsg));
      log(`Sent chat message to ${peerId}`);
    });
  }

  sendButton.onclick = sendMessage;
  inputBox.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  // Display incoming chat messages
  // Extend the message handler above:

  ws.addEventListener("message", (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "chat") {
      log(`From ${data.senderId}: ${data.data}`);
    }
  });

})();
</script>

</body>
</html>
